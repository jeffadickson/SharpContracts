name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile-all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Show SDK and environment
        run: dotnet --info
      - name: Build all production and test projects
        shell: bash
        run: |
          set -o pipefail
          mkdir -p artifacts/build
          projects=(
            SharpContracts.Runtime/SharpContracts.Runtime.csproj
            SharpContracts.Analyzers/SharpContracts.Analyzers.csproj
            SharpContracts.Solver/SharpContracts.Solver.csproj
            SharpContracts.Verification/SharpContracts.Verification.csproj
            SharpContracts.Cli/SharpContracts.Cli.csproj
            SharpContracts.Demo/SharpContracts.Demo.csproj
            SharpContracts.Tests/SharpContracts.Tests.csproj
            SharpContracts.Solver.Tests/SharpContracts.Solver.Tests.csproj
            SharpContracts.Verification.Tests/SharpContracts.Verification.Tests.csproj
          )
          failures=0
          for project in "${projects[@]}"; do
            echo "::group::Building $project"
            echo "===== $project =====" >> artifacts/build/build.log
            if dotnet build "$project" --configuration Release --nologo 2>&1 | tee -a artifacts/build/build.log; then
              echo "PASS: $project" | tee -a artifacts/build/summary.log
            else
              echo "FAIL: $project" | tee -a artifacts/build/summary.log
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          done
          cat artifacts/build/summary.log
          if [ "$failures" -ne 0 ]; then
            echo "::error::$failures project(s) failed compilation"
            exit 1
          fi
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpcontracts-build-log
          path: artifacts/build/*.log
          if-no-files-found: ignore
          retention-days: 14

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore SharpContracts.Tests/SharpContracts.Tests.csproj
      - name: Test runtime and compile analyzer
        run: dotnet test SharpContracts.Tests/SharpContracts.Tests.csproj --configuration Release --logger 'trx;LogFileName=runtime.trx' --results-directory artifacts/test-results/runtime
      - name: Upload runtime results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpcontracts-runtime-test-results
          path: artifacts/test-results/runtime/**/*.trx
          if-no-files-found: ignore
          retention-days: 14
      - name: Build runnable example

        run: dotnet build SharpContracts.Demo/SharpContracts.Demo.csproj --configuration Release

  solver-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native Z3 Linux runtime dependency
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Run actual Z3 solver tests
        run: dotnet test SharpContracts.Solver.Tests/SharpContracts.Solver.Tests.csproj --configuration Release --logger 'trx;LogFileName=solver.trx' --results-directory artifacts/test-results/solver

      - name: Upload solver results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpcontracts-solver-test-results
          path: artifacts/test-results/solver/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  source-verification-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: sudo apt-get update && sudo apt-get install -y libgomp1
      - run: dotnet test SharpContracts.Verification.Tests/SharpContracts.Verification.Tests.csproj --configuration Release --logger 'trx;LogFileName=verification.trx' --results-directory artifacts/test-results/verification

      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sharpcontracts-verification-test-results
          path: artifacts/test-results/verification/**/*.trx
          if-no-files-found: ignore
          retention-days: 14

  tutorial-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate embedded tutorial and demo JavaScript
        run: python3 scripts/check_html.py

  cli-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Native Z3 dependency
        run: sudo apt-get update && sudo apt-get install -y libgomp1
      - name: Build verification CLI
        run: dotnet build SharpContracts.Cli/SharpContracts.Cli.csproj --configuration Release
      - name: Prove safe byte promotion
        run: dotnet run --no-build --configuration Release --project SharpContracts.Cli -- examples/VerifiedByteAddition.cs Check
      - name: Validate machine-readable proof report and exit codes
        run: python3 scripts/check_cli_report.py
      - name: Counterexample must exit nonzero (code 1)
        shell: bash
        run: |
          set +e
          dotnet run --no-build --configuration Release --project SharpContracts.Cli -- examples/OverflowCounterexample.cs Check
          code=$?
          set -e
          test "$code" -eq 1

  ci-gate:
    name: CI Gate
    if: ${{ always() }}
    needs:
      - compile-all
      - build-test
      - solver-tests
      - source-verification-tests
      - tutorial-smoke
      - cli-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Report all required job conclusions
        shell: bash
        env:
          COMPILE_ALL: ${{ needs.compile-all.result }}
          BUILD_TEST: ${{ needs.build-test.result }}
          SOLVER_TESTS: ${{ needs.solver-tests.result }}
          VERIFIER_TESTS: ${{ needs.source-verification-tests.result }}
          TUTORIAL_SMOKE: ${{ needs.tutorial-smoke.result }}
          CLI_SMOKE: ${{ needs.cli-smoke.result }}
        run: |
          failures=0
          echo '### SharpContracts CI Gate' >> "$GITHUB_STEP_SUMMARY"
          echo '| Required job | Conclusion |' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---|' >> "$GITHUB_STEP_SUMMARY"
          for entry in "compile-all:$COMPILE_ALL" "build-test:$BUILD_TEST" "solver-tests:$SOLVER_TESTS" "source-verification-tests:$VERIFIER_TESTS" "tutorial-smoke:$TUTORIAL_SMOKE" "cli-smoke:$CLI_SMOKE"; do
            name="${entry%%:*}"
            status="${entry#*:}"
            echo "| $name | $status |" >> "$GITHUB_STEP_SUMMARY"
            echo "$name: $status"
            if [[ "$status" != "success" ]]; then
              echo "::error title=Required CI job failed::$name finished '$status'"
              failures=$((failures + 1))
            fi
          done
          if (( failures > 0 )); then
            echo "### FAILED: $failures required job(s) did not succeed" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo '### PASSED: all required jobs succeeded' >> "$GITHUB_STEP_SUMMARY"
